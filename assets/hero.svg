    <text x="106" y="107" fill="#eff5ec" font-size="21" letter-spacing="3">ROGER ARANA · OFFENSIVE SECURITY</text>
    <text x="72" y="286" fill="#eff5ec" font-size="162" font-weight="800" letter-spacing="-9">ROGER <tspan fill="#c6f66b">F5</tspan></text>
    <text x="82" y="341" fill="#eff5ec" font-size="26" letter-spacing="3.2">SECURITY ENGINEER / TOOL BUILDER</text>
  </g>

