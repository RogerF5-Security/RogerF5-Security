<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Roger F5 — Security Engineer / Tool Builder</title>
  <desc id="description">Roger Arana, offensive security. A custom electric-lime and cyan radio circuit illustration accompanies the disciplines pentesting, automation, and hardware hacking.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#eff5ec" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="signal" x1="1074" y1="175" x2="1455" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c6f66b"/>
      <stop offset="1" stop-color="#6bded8"/>
    </linearGradient>
    <linearGradient id="baseline" x1="80" y1="0" x2="1520" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c6f66b"/>
      <stop offset=".48" stop-color="#c6f66b" stop-opacity=".28"/>
      <stop offset="1" stop-color="#6bded8" stop-opacity=".12"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="translate(1310 274) rotate(90) scale(245)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6bded8" stop-opacity=".075"/>
      <stop offset="1" stop-color="#6bded8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- A self-contained vector masthead. No external fonts or image services. -->
  <rect width="1600" height="560" rx="24" fill="#080d12"/>
  <rect x="1" y="1" width="1598" height="558" rx="23" stroke="#eff5ec" stroke-opacity=".14"/>
  <rect x="40" y="40" width="1520" height="480" fill="url(#grid)"/>
